<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="css-reset.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Tic Tac Toe</h1>

    <div class="players-names-container">
      <div class="player-1">
        <label for="player1">Player(X):</label>
        <input
          class="players-input"
          id="player1"
          type="text"
          placeholder="Your name (e.g., Maria Mia)."
          value="Player-1 "
        />
      </div>
      <div class="start-btn-container">
        <button class="start-btn">Start</button>
        <div class="winner-container">
          <p class="winner"></p>
        </div>
      </div>
      <div class="player-2">
        <label for="player2">Player(O):</label>
        <input
          class="players-input"
          id="player2"
          type="text"
          placeholder="Your name (e.g., Sam Ali)."
          value="Player-2 "
        />
      </div>
    </div>

    <div class="main">
      <div class="game-container">
        <div class="row">
          <button class="cell"></button>
          <button class="cell column"></button>
          <button class="cell"></button>
        </div>
        <div class="row">
          <button class="cell"></button>
          <button class="cell column"></button>
          <button class="cell"></button>
        </div>
        <div class="row">
          <button class="cell"></button>
          <button class="cell column"></button>
          <button class="cell"></button>
        </div>
      </div>

      <div class="restart-container">
        <button id="sound-btn" aria-label="Mute sound" aria-pressed="false">
          <img class="icon-sound-on" src="assets/icons/speaker-unmuted.svg" alt="">
          <img class="icon-sound-muted" src="assets/icons/speaker-muted.svg" alt="">
        </button>
        <button class="restart-btn">Restart</button>
      </div>
    </div>

    <script type="module" src="script.js"></script>
  </body>
</html>
